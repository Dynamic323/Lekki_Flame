      :root {
        --bg-color: #0d0d0d;
        --surface-color: #1a1a1a;
        --surface-accent: #222222;
        --primary: #f4a02a; /* Warm Amber */
        --secondary: #c0392b; /* Pepper Red */
        --text-main: #f5f0e8; /* Warm Off-White */
        --text-muted: #888888;
        --glass-border: rgba(255, 255, 255, 0.05);
        --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        --shadow-warm:
          0 30px 60px -12px rgba(0, 0, 0, 0.5),
          0 18px 36px -18px rgba(244, 160, 42, 0.15);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "DM Sans", sans-serif;
        overflow-x: hidden;
        line-height: 1.6;
        letter-spacing: -0.01em;
      }

      /* Fixed Grain Texture Overlay */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      h1,
      h2,
      h3,
      .display-font {
        font-family: "Playfair Display", serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 2.5rem;
      }

      @media (max-width: 768px) {
        .container {
          padding: 0 1.25rem;
        }
      }

      /* --- UI COMPONENTS --- */

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.875rem 1.75rem;
        border-radius: 2px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        cursor: pointer;
        transition: var(--transition-smooth);
        text-decoration: none;
        gap: 0.75rem;
        border: none;
      }

      .btn:active {
        transform: scale(0.97) translateY(1px);
      }

      .btn-primary {
        background-color: var(--primary);
        color: #0d0d0d;
      }
      .btn-primary:hover {
        filter: brightness(1.05);
        box-shadow: 0 15px 30px -10px rgba(244, 160, 42, 0.3);
      }

      .btn-outline {
        background: transparent;
        border: 1px solid var(--primary);
        color: var(--primary);
      }
      .btn-outline:hover {
        background: var(--primary);
        color: #000;
      }

      .pill {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 2px;
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }

      .pill-amber {
        background: var(--primary);
        color: #0d0d0d;
      }
      .pill-red {
        background: var(--secondary);
        color: #fff;
      }

      /* --- NAVBAR --- */
      nav {
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
        transition: var(--transition-smooth);
        padding: 2rem 0;
        border-bottom: 1px solid transparent;
      }

      nav.scrolled {
        padding: 1.25rem 0;
        background: rgba(13, 13, 13, 0.85);
        backdrop-filter: blur(24px);
        border-bottom: 1px solid var(--glass-border);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .nav-wrapper {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 1.5rem;
        color: var(--primary);
        text-decoration: none;
      }

      .nav-links {
        display: flex;
        gap: 2.5rem;
      }

      .nav-links a {
        color: var(--text-main);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        opacity: 0.8;
        transition: var(--transition-smooth);
      }

      .nav-links a:hover {
        opacity: 1;
        color: var(--primary);
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 1.5rem;
      }

      /* --- HERO --- */
      .hero {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        position: relative;
        padding-top: 100px;
        overflow: hidden;
      }

      .hero::after {
        content: "";
        position: absolute;
        top: 40%;
        left: 20%;
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(244, 160, 42, 0.08) 0%,
          rgba(13, 13, 13, 0) 70%
        );
        pointer-events: none;
        z-index: -1;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 4rem;
        align-items: center;
      }

      .hero-text h1 {
        font-size: clamp(3.5rem, 8vw, 6rem);
        line-height: 0.95;
        margin-bottom: 1.5rem;
      }

      .hero-text p {
        font-size: 1.125rem;
        color: var(--text-muted);
        margin-bottom: 2.5rem;
        max-width: 50ch;
      }

      .search-container {
        position: relative;
        max-width: 600px;
      }

      .search-input {
        width: 100%;
        background: var(--surface-color);
        border: 1px solid var(--glass-border);
        padding: 1.25rem 1.5rem;
        padding-right: 120px;
        border-radius: 4px;
        color: var(--text-main);
        font-size: 1rem;
        outline: none;
        transition: var(--transition-smooth);
      }

      .search-input:focus {
        border-color: var(--primary);
      }

      .search-btn {
        position: absolute;
        right: 8px;
        top: 8px;
        bottom: 8px;
        background: var(--primary);
        color: #000;
        padding: 0 1.5rem;
        border-radius: 2px;
        font-weight: 700;
        border: none;
        cursor: pointer;
      }

      .hero-collage {
        position: relative;
        height: 500px;
      }

      .collage-img {
        position: absolute;
        border-radius: 4px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        background: var(--surface-color);
        overflow: hidden;
        border: 4px solid var(--surface-color);
      }

      .img-1 {
        width: 300px;
        height: 380px;
        z-index: 3;
        top: 0;
        left: 10%;
        transform: rotate(-3deg);
      }
      .img-2 {
        width: 260px;
        height: 320px;
        z-index: 2;
        bottom: 0;
        right: 0;
        transform: rotate(5deg);
      }
      .img-3 {
        width: 220px;
        height: 260px;
        z-index: 1;
        top: 20%;
        right: 10%;
        transform: rotate(12deg);
        opacity: 0.6;
      }

      /* --- SECTIONS --- */
      section {
        padding: 8rem 0;
      }

      .section-header {
        margin-bottom: 4rem;
      }

      .section-tag {
        color: var(--primary);
        font-weight: 700;
        letter-spacing: 0.2em;
        font-size: 0.75rem;
        margin-bottom: 0.5rem;
        display: block;
      }

      /* --- TRENDING ROWS --- */
      .trending-wrapper {
        margin-right: -2rem;
        overflow: hidden;
      }

      .trending-scroll {
        display: flex;
        gap: 2rem;
        overflow-x: scroll;
        padding: 1rem 0;
        scrollbar-width: none;
        -ms-overflow-style: none;
        cursor: grab;
      }

      .trending-scroll::-webkit-scrollbar {
        display: none;
      }

      .dish-card {
        min-width: 280px;
        background: var(--surface-color);
        border-radius: 4px;
        overflow: hidden;
        transition: var(--transition-smooth);
      }

      .dish-card:hover {
        transform: translateY(-8px);
        box-shadow: var(--shadow-warm);
      }

      .dish-img {
        height: 200px;
        background-size: cover;
        background-position: center;
      }

      .dish-info {
        padding: 1.5rem;
      }

      /* --- ASYMMETRIC GRID --- */
      .restaurant-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr;
        grid-auto-rows: 400px;
        gap: 2rem;
      }

      .res-card {
        position: relative;
        background: var(--surface-color);
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: var(--transition-smooth);
      }

      .res-card:nth-child(2),
      .res-card:nth-child(5) {
        grid-row: span 1.2;
      }
      .res-card:nth-child(1),
      .res-card:nth-child(6) {
        grid-column: span 1;
      }

      .res-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-warm);
      }

      .res-img-wrap {
        height: 60%;
        position: relative;
        overflow: hidden;
      }

      .res-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .res-card:hover .res-img {
        transform: scale(1.05);
      }

      .res-content {
        padding: 1.5rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* --- HOW IT WORKS --- */
      .how-section {
        background: #111;
      }

      .how-grid {
        display: flex;
        flex-direction: column;
        gap: 6rem;
        max-width: 1000px;
        margin: 0 auto;
      }

      .how-step {
        display: flex;
        align-items: center;
        gap: 4rem;
        opacity: 0;
        transform: translateY(30px);
        transition: var(--transition-smooth);
      }

      .how-step.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .how-step:nth-child(even) {
        flex-direction: row-reverse;
        text-align: right;
      }

      .step-num {
        font-size: 8rem;
        color: var(--primary);
        opacity: 0.15;
        line-height: 1;
        font-family: "Playfair Display", serif;
      }

      /* --- FOOTER --- */
      footer {
        padding: 6rem 0 2rem;
        border-top: 1px solid var(--glass-border);
      }

      /* --- SPAN / PROFILE --- */
      #page-target {
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
      }

      .page-transition {
        opacity: 0;
        transform: translateY(10px);
      }

      /* --- TOAST & MODAL --- */
      #toast-container {
        position: fixed;
        top: 2rem;
        right: 2rem;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .toast {
        background: var(--surface-accent);
        border-left: 4px solid var(--primary);
        padding: 1rem 1.5rem;
        border-radius: 4px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        gap: 1rem;
        animation: slideIn 0.3s forwards;
      }

      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      /* Responsive Fallbacks */
      @media (max-width: 1024px) {
        .hero-grid {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .hero-collage {
          display: none;
        }
        .hero-text p {
          margin: 0 auto 2.5rem;
        }
        .search-container {
          margin: 0 auto;
        }
        .restaurant-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 768px) {
        .restaurant-grid {
          grid-template-columns: 1fr;
          grid-auto-rows: auto;
        }
        .nav-links {
          display: none;
        }
        .how-step {
          flex-direction: column !important;
          text-align: center !important;
        }
        .step-num {
          font-size: 5rem;
        }
      }
    </style>

        el.addEventListener("mousedown", (e) => {
          isDown = true;
          el.style.cursor = "grabbing";
          startX = e.pageX - el.offsetLeft;
          scrollLeft = el.scrollLeft;
        });
        el.addEventListener("mouseleave", () => {
          isDown = false;
          el.style.cursor = "grab";
        });
        el.addEventListener("mouseup", () => {
          isDown = false;
          el.style.cursor = "grab";
        });
        el.addEventListener("mousemove", (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - el.offsetLeft;
          const walk = (x - startX) * 2;
          el.scrollLeft = scrollLeft - walk;

          </div>
        </div>
        <button class="btn btn-primary" onclick="openModal('${res.name}')" style="flex-shrink: 0; display: flex; align-items: center; gap: 0.5rem;">
          <i data-lucide="shopping-bag" style="width: 16px; height: 16px;"></i> Shop With Us
        </button>
      </div>
    </div>

    <!-- CONTACT MODAL -->
    <div id="contact-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 1rem;">
      <div style="background: var(--surface-accent); width: 100%; max-width: 420px; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid var(--glass-border);">
        
        <!-- Modal hero strip -->
        <div style="height: 100px; background: linear-gradient(135deg, rgba(var(--primary-rgb, 234,179,8), 0.2), transparent); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; padding: 1.5rem;">
          <div>
            <p style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin: 0 0 0.25rem;">Contact</p>
            <h3 class="display-font" style="font-size: 1.8rem; margin: 0; color: var(--primary);">${res.name}</h3>
          </div>
        </div>

        <button onclick="closeModal()" style="position: absolute; top: 1rem; right: 1rem; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <i data-lucide="x" style="width: 16px; height: 16px;"></i>
        </button>

        <div style="padding: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
          <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0 0 0.5rem;">Reach out directly for faster service and custom orders.</p>
          <a href="https://wa.me/${res.whatsapp || "234"}" target="_blank" class="btn btn-outline" style="justify-content: flex-start; gap: 0.75rem;">
            <i data-lucide="message-circle" style="width: 18px; height: 18px; color: #4ade80;"></i> Message on WhatsApp
          </a>
          <a href="tel:${res.phone}" class="btn btn-outline" style="justify-content: flex-start; gap: 0.75rem;">
            <i data-lucide="phone" style="width: 18px; height: 18px; color: var(--primary);"></i> Call ${res.phone}
          </a>
          ${
            res.instagram
              ? `
          <a href="https://instagram.com/${res.instagram}" target="_blank" class="btn btn-outline" style="justify-content: flex-start; gap: 0.75rem;">
            <i data-lucide="instagram" style="width: 18px; height: 18px; color: #e879f9;"></i> @${res.instagram} on Instagram
          </a>`
              : ""
          }
        </div>
      </div>
    </div>
  `;

        window.activeResId = id;
        switchTab("menu");
      };

      const switchTab = (tab) => {
        const res = restaurants.find((r) => r.id === window.activeResId);
        const content = document.getElementById("tab-content");
        const btns = ["menu", "reviews", "about"];

        btns.forEach((b) => {
          const el = document.getElementById(`tab-${b}`);
          if (b === tab) {
            el.style.color = "var(--primary)";
            el.style.borderBottom = "2px solid var(--primary)";
          } else {
            el.style.color = "var(--text-muted)";
            el.style.borderBottom = "none";
          }
        });

        if (tab === "menu") {
          content.innerHTML = `
                    <div style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); display: grid; gap: 2rem;">
                        ${res.menu
                          .map(
                            (item) => `
                            <div class="dish-card" style="background: var(--surface-accent);">
                                <div class="dish-img" style="background-image: url('${item.image}')"></div>
                                <div class="dish-info">
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                        <h4 style="font-size: 1.1rem;">${item.name}</h4>
                                        <span style="color: var(--primary); font-weight: 700;">₦${item.price.toLocaleString()}</span>
                                    </div>
                                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">${item.desc}</p>
                                    <button class="btn btn-outline" style="width: 100%; border-color: rgba(255,255,255,0.1); color: var(--text-main);" onclick="showToast('Added to order!')">
                                        <i data-lucide="shopping-bag" style="width: 16px;"></i> Add to Chop
                                    </button>
                                </div>
                            </div>
                        `,
                          )
                          .join("")}
                    </div>
                `;
        } else if (tab === "reviews") {
          content.innerHTML = `
                    <div style="max-width: 800px; display: flex; flex-direction: column; gap: 2rem;">
                        ${res.reviews
                          .map(
                            (rev, i) => `
                            <div style="opacity: 0; transform: translateY(10px); animation: fadeIn 0.3s forwards; animation-delay: ${i * 0.1}s;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                                    <div style="display: flex; items: center; gap: 1rem;">
                                        <div style="width: 42px; height: 42px; border-radius: 50%; background: var(--surface-accent); display: flex; items: center; justify-content: center; font-weight: 700; color: var(--primary); border: 1px solid var(--primary);">
                                            ${rev.name
                                              .split(" ")
                                              .map((n) => n[0])
                                              .join("")}
                                        </div>
                                        <div>
                                            <p style="font-weight: 700;">${rev.name}</p>
                                            <p style="font-size: 0.75rem; color: var(--text-muted);">${rev.date}</p>
                                        </div>
                                    </div>
                                    <div style="display: flex; gap: 2px;">
                                        ${Array(5)
                                          .fill(0)
                                          .map(
                                            (_, i) =>
                                              `<i data-lucide="star" style="width: 14px; fill: ${i < rev.rating ? "var(--primary)" : "transparent"}; color: var(--primary)"></i>`,
                                          )
                                          .join("")}
                                    </div>
                                </div>
                                <p style="color: var(--text-muted); line-height: 1.6; padding-left: 3.5rem;">"${rev.text}"</p>
                            </div>
                        `,
                          )
                          .join("")}
                    </div>
                `;
        } else if (tab === "about") {
          content.innerHTML = `
                    <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 4rem;">
                        <div>
                            <h3 class="display-font" style="font-size: 2rem; margin-bottom: 1.5rem;">Authenticity First</h3>
                            <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 1.1rem; line-height: 1.8;">${res.about}</p>
                            <div style="display: flex; items: center; gap: 1rem; color: var(--text-muted);">
                                <i data-lucide="map-pin" style="color: var(--primary)"></i>
                                <span>${res.location}</span>
                            </div>
                        </div>
                        <div style="background: var(--surface-accent); padding: 2rem; border-radius: 4px;">
                            <h4 style="margin-bottom: 1.5rem; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;">Opening Hours</h4>
                            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                                ${Object.entries(res.hours)
                                  .map(
                                    ([day, time]) => `
                                    <div style="display: flex; justify-content: space-between; font-size: 0.9rem; opacity: ${day === new Date().toLocaleDateString("en-US", { weekday: "short" }) ? "1" : "0.6"}">
                                        <span style="${day === new Date().toLocaleDateString("en-US", { weekday: "short" }) ? "color: var(--primary); font-weight: 700;" : ""}">${day}</span>
                                        <span style="${day === new Date().toLocaleDateString("en-US", { weekday: "short" }) ? "color: var(--primary); font-weight: 700;" : ""}">${time}</span>
                                    </div>
                                `,
                                  )
                                  .join("")}
                            </div>
                        </div>
                    </div>
                `;
        }
        lucide.createIcons();
      };

      const handleSearch = (query) => {
        const grid = document.getElementById("res-grid");
        if (!grid) return;

        const q = query.toLowerCase();
        const filtered = restaurants.filter(
          (r) =>
            r.name.toLowerCase().includes(q) ||
            r.cuisine.toLowerCase().includes(q) ||
            r.location.toLowerCase().includes(q),
        );

        if (filtered.length === 0) {
          grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 0;">
                        <i data-lucide="search-x" style="width: 48px; height: 48px; opacity: 0.2; margin-bottom: 1rem;"></i>
                        <p style="color: var(--text-muted);">We couldn't find any bukats matching "${query}".</p>
                        <button onclick="document.getElementById('main-search').value=''; handleSearch('')" style="background: none; border: none; color: var(--primary); cursor: pointer; margin-top: 1rem; text-decoration: underline;">Clear search</button>
                    </div>
                `;
        } else {
          grid.innerHTML = filtered.map((res) => renderResCard(res)).join("");
        }
        lucide.createIcons();
      };

      const openModal = () =>
        (document.getElementById("contact-modal").style.display = "flex");
      const closeModal = () =>
        (document.getElementById("contact-modal").style.display = "none");

      const observeSteps = () => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) entry.target.classList.add("visible");
            });
          },
          { threshold: 0.3 },
        );

        document
          .querySelectorAll(".how-step")
          .forEach((s) => observer.observe(s));
      };

      window.addEventListener("scroll", () => {
        if (window.scrollY > 50) navbar.classList.add("scrolled");
        else navbar.classList.remove("scrolled");
      });

      document.addEventListener("DOMContentLoaded", () => {
        renderHome();
        lucide.createIcons();
      });

      // Modal Close on backdrop
      window.onclick = (e) => {
        const modal = document.getElementById("contact-modal");
        if (e.target == modal) closeModal();
      };
    </script>
  </body>
</html>
